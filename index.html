<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>9만 에이커 웹</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체를 3D 디오라마 섬이 채우고, 장난감처럼 둥근 HUD·버튼·시트가 그 위에 떠 있다.
   의도적으로 밝은 단일 테마(하늘·종이·사탕색)를 쓴다. */
:root {
  --sky: #bfe9ff; --sky2: #e6f7ff;
  --paper: #ffffff; --paper2: #f3f8ff; --paper3: #e8f1fd; --line: #d4e2f4;
  --ink: #33305a; --ink2: #7a7fa6;
  --sun: #ffc23d; --sun-d: #e3920f; --mint: #3fd08f; --mint-d: #1fa268; --coral: #ff6f7d; --coral-d: #dc4658;
  --sea: #4fb0ff; --sea-d: #2a80d1; --grape: #a77bff; --grape-d: #7a50d6;
  --font-display: 'Jua', 'Gowun Dodum', system-ui, sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font: 14px/1.5 var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
[hidden] { display: none !important; }
svg.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: none; }
h3 { font: 18px/1.2 var(--font-display); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; text-wrap: balance; }
h3 .n { font-size: 13px; color: var(--ink2); }
p { margin: 6px 0; }
.muted { color: var(--ink2); font-size: 13px; }
.good { color: var(--mint-d); } .bad, .neg { color: var(--coral-d); } .warn { color: var(--sun-d); }
.grow { flex: 1; min-width: 0; }

/* 버튼: 아래쪽 두께가 있는 장난감 버튼 */
button { font: 15px/1.2 var(--font-display); color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .06s, box-shadow .06s; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
button:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--sun); border-color: var(--sun-d); box-shadow: 0 4px 0 var(--sun-d); }
button.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--sun-d); }
button.mint { background: var(--mint); border-color: var(--mint-d); box-shadow: 0 4px 0 var(--mint-d); color: #fff; }
button.danger { color: var(--coral-d); border-color: #ffc6cc; box-shadow: 0 3px 0 #ffc6cc; }
button.on { background: var(--paper3); border-color: var(--sea); box-shadow: 0 3px 0 var(--sea-d); }
button small { font-family: var(--font-body); font-size: 11px; color: var(--ink2); display: block; }
textarea, input[type=text] { font: inherit; color: var(--ink); background: var(--paper2); border: 2px solid var(--line); border-radius: 12px; padding: 8px; width: 100%; user-select: text; -webkit-user-select: text; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--sun-d); flex: none; }

/* 칩·배지 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--paper2); border: 1.5px solid var(--line); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.lack { border-color: #ffc6cc; color: var(--coral-d); background: #fff1f3; }
.chip.hero { border-color: #d8c6ff; background: #f5efff; color: var(--grape-d); }
.chip.on { border-color: var(--sea); background: #e8f5ff; }
.lvb { display: inline-flex; align-items: center; justify-content: center; font: 12px/1 var(--font-display); background: var(--ink); color: #fff; border-radius: 8px; padding: 3px 6px; }
.grade { font: 12px/1 var(--font-display); border-radius: 8px; padding: 3px 7px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
.g0 { background: #b7bdd0; } .g1 { background: #9aa9c4; } .g2 { background: #4fb0ff; } .g3 { background: #3fd08f; } .g4 { background: #f2b51e; } .g5 { background: #ff9a3c; } .g6 { background: #ff6f7d; } .g7 { background: #a77bff; } .g8 { background: linear-gradient(90deg, #ff6f7d, #ffc23d, #3fd08f, #4fb0ff, #a77bff); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.btns.col { flex-direction: column; align-items: stretch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.bar { height: 8px; background: var(--paper3); border-radius: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--sun); border-radius: 6px; }
.tbl { overflow-x: auto; } table { border-collapse: collapse; font-size: 12px; width: 100%; } th, td { border-bottom: 1.5px solid var(--line); padding: 6px; text-align: left; vertical-align: top; } th { font-family: var(--font-display); font-weight: normal; }
details { margin: 8px 0; background: var(--paper2); border-radius: 14px; padding: 8px 12px; } summary { cursor: pointer; font-family: var(--font-display); }

/* 초상화 */
img.pt { width: 52px; height: 52px; flex: none; border-radius: 16px; background: radial-gradient(circle at 50% 70%, #fff 0%, var(--paper3) 70%); object-fit: contain; opacity: 0; transition: opacity .2s; }
img.pt.ready { opacity: 1; }
img.pt.lg { width: 96px; height: 96px; border-radius: 24px; }
img.pt.sm { width: 38px; height: 38px; border-radius: 12px; }
img.pt.xs { width: 30px; height: 30px; border-radius: 10px; }

/* 카드 행 */
.row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--paper); border: 2px solid var(--line); margin: 8px 0; }
.row.dim { opacity: .6; }
.row .name { font: 16px/1.2 var(--font-display); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .desc { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
.row.pick { cursor: pointer; } .row.pick.on { border-color: var(--sun-d); background: #fff8e6; }
.ico-box { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; flex: none; background: var(--paper2); }
.tabs { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
.tabs button { min-height: 34px; padding: 6px 12px; font-size: 14px; }
.note { background: #fff8e6; border: 2px dashed #ffd98a; border-radius: 14px; padding: 8px 12px; font-size: 13px; margin: 8px 0; }

/* 무대 (3D 지도) */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: var(--sky); }
#stage canvas { display: block; width: 100%; height: 100%; }
#stage.away canvas, #stage.away .labels { visibility: hidden; } /* 전투 중: WebGL 캔버스를 하나만 합성 */
#battle.modal { background: linear-gradient(180deg, #bfe9ff 0%, #e6f7ff 100%); }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; white-space: nowrap; font: 12px/1 var(--font-display); color: var(--ink); background: rgba(255,255,255,.94); border-radius: 10px; padding: 4px 8px; box-shadow: 0 2px 0 rgba(51,48,90,.18); display: inline-flex; align-items: center; gap: 4px; will-change: transform; }
.lb i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid rgba(51,48,90,.4); }
.lb.cap { font-size: 13px; padding: 5px 10px; } .lb .hp { color: var(--coral); letter-spacing: -1px; }
.lb.ruin { background: #f3ecff; color: var(--grape-d); }
.lb.giant { background: var(--coral); color: #fff; }
.lb.army { background: var(--sun); } .lb.army.foe { background: var(--coral); color: #fff; }
.lb.lv { font-size: 10.5px; padding: 2px 6px; background: rgba(255,255,255,.82); box-shadow: none; } .lb.lv.hard { color: #c45a00; } .lb.lv.foe { color: #fff; background: rgba(220,70,88,.85); }

/* HUD */
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
#hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 16px 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#hud > * { pointer-events: auto; }
#resbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 620px; }
.res { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); border-radius: 16px; padding: 4px 8px 4px 4px; box-shadow: 0 3px 0 rgba(51,48,90,.14); min-width: 0; }
.res .ib { width: 30px; height: 30px; border-radius: 11px; display: grid; place-items: center; font-size: 22px; flex: none; }
.res b { font: 16px/1.05 var(--font-display); display: block; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res small { font-size: 10.5px; color: var(--mint-d); display: block; line-height: 1.1; white-space: nowrap; } .res small.neg { color: var(--coral-d); } .res.full b { color: var(--sun-d); }
#hudrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94); border-radius: 999px; padding: 5px 12px; box-shadow: 0 3px 0 rgba(51,48,90,.14); font: 14px/1 var(--font-display); white-space: nowrap; }
.pill.season { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.18); }
.pill.pvp { color: var(--ink2); font-size: 12px; } .pill.pvp.on { background: var(--coral); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
#speed { display: inline-flex; background: rgba(255,255,255,.94); border-radius: 999px; padding: 3px; box-shadow: 0 3px 0 rgba(51,48,90,.14); margin-left: auto; }
#speed button { min-height: 30px; padding: 3px 10px; border: 0; box-shadow: none; background: transparent; font-size: 13px; border-radius: 999px; }
#speed button.on { background: var(--sun); }
#queues { display: flex; gap: 6px; flex-wrap: wrap; }
.q { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.88); border-radius: 12px; padding: 3px 8px; font-size: 12px; box-shadow: 0 2px 0 rgba(51,48,90,.12); }
.q .bar { width: 46px; height: 6px; }
#mapbtns { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
#mapbtns button { width: 46px; height: 46px; padding: 0; border-radius: 50%; font-size: 22px; background: rgba(255,255,255,.95); }
#toasts { position: absolute; left: 50%; top: calc(132px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; width: min(92%, 440px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.97); border-radius: 16px; padding: 8px 12px; font-size: 13.5px; box-shadow: 0 4px 0 rgba(51,48,90,.14); animation: pop .25s ease-out; }
.toast .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; flex: none; color: #fff; background: var(--sea); }
.toast.good .dot { background: var(--mint); } .toast.bad .dot { background: var(--coral); } .toast.warn .dot { background: var(--sun-d); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
#tilepop { position: absolute; left: 12px; right: 12px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: 470px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 12px 14px; max-height: 46%; overflow: auto; box-shadow: 0 6px 0 rgba(51,48,90,.16), 0 10px 30px rgba(51,48,90,.18); border: 2px solid var(--line); }
.tp-head { display: flex; align-items: center; gap: 8px; }
.tp-head .t { font: 18px/1.2 var(--font-display); }
.tp-head .x { margin-left: auto; width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; }
.mons { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.mon { display: flex; align-items: center; gap: 8px; background: var(--paper2); border-radius: 14px; padding: 4px 8px 4px 4px; font-size: 12.5px; }
.mon b { font: 14px var(--font-display); }
#bottom { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; background: rgba(255,255,255,.96); border-radius: 24px; padding: 6px; box-shadow: 0 5px 0 rgba(51,48,90,.16), 0 8px 24px rgba(51,48,90,.16); }
#bottom button { flex-direction: column; gap: 2px; min-height: 58px; padding: 4px 0; border: 0; box-shadow: none; background: transparent; border-radius: 18px; font-size: 12px; }
#bottom button .ic { font-size: 28px; }
#bottom button.on { background: #fff3cf; }

/* 바텀시트 */
.modal { position: fixed; inset: 0; background: rgba(51,48,90,.32); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--paper); width: min(100%, 680px); max-height: 88%; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(51,48,90,.22); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
.sheet > header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 2px solid var(--paper3); position: relative; }
.sheet > header::before { content: ''; position: absolute; left: 50%; top: 6px; width: 44px; height: 5px; border-radius: 3px; background: var(--line); transform: translateX(-50%); }
.sheet h2 { margin: 0; font: 21px/1.2 var(--font-display); flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.sheet h2 .ic { font-size: 28px; }
.sheet h2 small { font: 13px var(--font-body); color: var(--ink2); }
.sheet .close { width: 40px; height: 40px; padding: 0; border-radius: 50%; min-height: 0; font-size: 18px; }
.sheet .body { overflow: auto; padding: 4px 16px 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); user-select: text; -webkit-user-select: text; }

/* 전투 */
#battle .sheet { max-height: none; height: 100%; border-radius: 0; animation: none; box-shadow: none; background: transparent; width: min(100%, 760px); } /* WebGL 캔버스가 있는 시트는 변형 애니메이션을 쓰지 않는다 */
#battle .sheet > header { border-bottom: 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
#battle .sheet > header::before { display: none; }
#btitle { flex-wrap: wrap; row-gap: 0; } #btitle .bt { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; } #btitle small { flex-basis: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 0 16px 6px; }
.vs .side { display: flex; flex-direction: column; gap: 2px; background: #fff; border-radius: 18px; padding: 6px 10px; box-shadow: 0 3px 0 rgba(51,48,90,.14); min-width: 0; }
.vs .side.d { text-align: right; } .vs .side .who { font: 15px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .vs .side .pts { display: flex; gap: 2px; flex-wrap: wrap; } .vs .side.d .pts { justify-content: flex-end; }
.vs .side .pts img.pt { width: 34px; height: 34px; border-radius: 10px; }
.vs .mark { font: 30px/1 var(--font-display); color: #ff6f7d; -webkit-text-stroke: 5px #3a2f4d; paint-order: stroke fill; }
#battle .body { background: #fff; border-radius: 22px 22px 0 0; margin-top: 10px; flex: 1; }
#battle header button { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.bstage { padding: 8px 16px 0; flex: none; }
#bwrap { position: relative; overflow: hidden; border-radius: 20px; background: var(--sky); }
#bwrap canvas { display: block; }
.b-overlay { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
.hpb { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; will-change: transform; }
.hpb .bar { display: block; width: 40px; height: 8px; background: #3a2f4d; border-radius: 5px; position: relative; overflow: hidden; border: 2px solid #fff; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.hpb .f { position: absolute; left: 0; top: 0; bottom: 0; background: #6be27a; transition: width .15s; } .hpb.d .f { background: #ff7d8a; } .hpb .f.low { background: #ffc23d; }
.hpb .s { position: absolute; left: 0; top: 0; height: 3px; background: #8fe3ff; }
.hpb .hn { font: 11px/1.2 var(--font-display); color: #fff; background: var(--grape); border-radius: 8px; padding: 1px 6px; }
.hpb .st { font: 10px/1.2 var(--font-display); color: #7a4b00; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
.ft { position: absolute; left: 0; top: 0; font: 18px/1 var(--font-display); color: #fff; -webkit-text-stroke: 4px #3a2f4d; paint-order: stroke fill; white-space: nowrap; }
.ft.crit { color: #ffb020; font-size: 23px; } .ft.critword { color: #ffd23f; font-size: 14px; } .ft.heal { color: #7ee081; } .ft.fixed { color: #d9b0ff; } .ft.dodge { color: #8fe3ff; } .ft.status { color: #ffe08a; font-size: 13px; } .ft.shield { color: #bfefff; font-size: 13px; }
.skill-bubble { position: absolute; left: 0; top: 0; background: #fff; border: 3px solid #3a2f4d; border-radius: 14px; padding: 2px 10px; font: 14px/1.3 var(--font-display); white-space: nowrap; }
.b-round { position: absolute; left: 10px; top: 10px; background: #fff; border-radius: 12px; padding: 3px 10px; font: 14px var(--font-display); box-shadow: 0 2px 0 rgba(51,48,90,.18); }
.b-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0); font: 46px/1 var(--font-display); color: #ffd23f; -webkit-text-stroke: 7px #3a2f4d; paint-order: stroke fill; transition: transform .35s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; }
.b-banner.show { transform: translate(-50%, -50%) scale(1); } .b-banner.lose { color: #c9d2e6; } .b-banner.draw { color: #fff; } .b-banner.start { font-size: 34px; color: #fff; }
#bresult { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; font: 16px var(--font-display); }
#blog { max-height: 150px; overflow: auto; font-size: 12.5px; padding: 6px 4px; }
#blog div { padding: 2px 0; border-bottom: 1px dashed var(--line); } #blog .skill { color: var(--sun-d); } #blog .hero { color: var(--grape-d); } #blog .sys { color: var(--sea-d); }

/* 결과 */
#over .sheet { align-self: center; border-radius: 28px; max-width: 440px; margin: 16px; }
#over h2 { font: 40px/1 var(--font-display); text-align: center; margin: 10px 0; }
#over ol { padding-left: 22px; } #over li { font: 16px/1.8 var(--font-display); }

/* 시작 화면 */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; text-align: center; background: linear-gradient(180deg, rgba(191,233,255,.25) 0%, rgba(191,233,255,0) 40%, rgba(255,255,255,.55) 100%); z-index: 30; }
#title h1 { margin: 0; font: clamp(56px, 15vw, 104px)/1 var(--font-display); color: #ffd23f; letter-spacing: 1px;
  text-shadow: 0 2px 0 #ffb020, 0 4px 0 #f29a10, 0 6px 0 #e3870a, 0 8px 0 #c86f00, 0 10px 0 #3a2f4d, 0 14px 18px rgba(51,48,90,.35);
  -webkit-text-stroke: 3px #3a2f4d; paint-order: stroke fill; }
#title .tag { background: rgba(255,255,255,.94); border-radius: 18px; padding: 10px 16px; max-width: 520px; box-shadow: 0 4px 0 rgba(51,48,90,.14); font-size: 14.5px; }
#title .btns button { min-width: 190px; min-height: 52px; font-size: 19px; }
#parade { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; max-width: 560px; min-height: 64px; }
body:not(.playing) .labels { display: none; }
#parade img.pt { width: 60px; height: 60px; background: transparent; animation: hop 1.1s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateY(-9px); } }
#title .hint { font-size: 12.5px; color: var(--ink); background: rgba(255,255,255,.75); padding: 4px 12px; border-radius: 12px; }
@media (prefers-reduced-motion: reduce) { #parade img.pt, .pill.pvp.on, .toast, .sheet { animation: none !important; } .b-banner { transition: none; } }
@media (max-width: 520px) {
  #hud { padding-left: 10px; padding-right: 10px; }
  .res { padding-right: 6px; } .res .ib { width: 26px; height: 26px; font-size: 18px; } .res b { font-size: 14px; }
  #bottom button { font-size: 10.5px; min-height: 54px; } #bottom button .ic { font-size: 24px; }
  #mapbtns button { width: 42px; height: 42px; font-size: 20px; }
  .pill { font-size: 13px; padding: 4px 10px; }
  #toasts { top: calc(150px + env(safe-area-inset-top, 0px)); }
}
</style>

  <div id="parade"></div>
  <p class="tag">1에이커에서 시작해 황야를 넓혀요. 자원을 모아 건물을 올리고, 병사에게 영웅 초상화와 장비를 달아 주면 전투는 알아서 굴러가요. 봄부터 겨울까지, 세 연맹과 땅을 다투는 한 판.</p>
